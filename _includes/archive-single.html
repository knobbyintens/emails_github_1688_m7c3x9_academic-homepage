<div class="publication-entry">
  <h3>{{ include.post.title }}</h3>
  <p class="publication-venue">{{ include.post.venue }}</p>
  <p class="publication-citation">{{ include.post.citation | markdownify }}</p>
  {% if include.post.codeurl and include.post.codeurl != "" %}
  <a class="btn btn--code" href="{{ include.post.codeurl }}">Code</a>
  {% endif %}
</div>
